name: Tests

on:
  pull_request:
  push:
    branches:
      - dev-orbyta

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: root
        ports:
          - 27017:27017

    steps:
      # The api submodule holds the proto contracts that pkg/api is generated from.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The Go version go.mod requires, so the build does not download a toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      # Regenerates pkg/api with the toolchain pinned in proto-toolchain.mk from
      # the contracts pinned by the api gitlink, and fails on any difference.
      - name: Generated API drift check
        run: make api-check

      # The inherited globaldb test expects the two instances a developer's
      # database carries and hardcodes the INF_ prefix; a fresh service
      # container has none, so seed them there.
      - name: Seed the test instances
        run: >
          docker exec ${{ job.services.mongo.id }} mongosh --quiet
          -u admin -p root --authenticationDatabase admin
          --eval 'db.getSiblingDB("INF_global-infos").instances.insertMany([{instanceID:"italy"},{instanceID:"test-instance"}])'
      - name: Test
        env:
          GLOBAL_DB_CONNECTION_STR: localhost:27017
          GLOBAL_DB_USERNAME: admin
          GLOBAL_DB_PASSWORD: root
          GLOBAL_DB_CONNECTION_PREFIX: ""
          MESSAGE_DB_CONNECTION_STR: localhost:27017
          MESSAGE_DB_USERNAME: admin
          MESSAGE_DB_PASSWORD: root
          MESSAGE_DB_CONNECTION_PREFIX: ""
          DB_TIMEOUT: 30
          DB_IDLE_CONN_TIMEOUT: 45
          DB_MAX_POOL_SIZE: 8
          DB_DB_NAME_PREFIX: CI_
          MESSAGING_CONFIG_FOLDER: ${{ github.workspace }}/test/configs
          # Used by the message-scheduler tests that need a real database;
          # without it they fail under CI (test/testenv).
          F04_TEST_MONGODB_URI: mongodb://admin:root@localhost:27017/?authSource=admin
          WHATSAPP_ENABLED: "true"
        # -v so that the next step can see skipped tests; bash for pipefail.
        shell: bash
        run: go test -race -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # A skipped test is a test CI did not run. The database tests fail
      # rather than skip under CI, and this catches any other skip.
      - name: No skipped tests
        run: |
          if grep -E -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
            echo "Tests were skipped; CI must run every test."
            exit 1
          fi
